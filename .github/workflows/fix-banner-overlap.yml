name: Fix banner title overlap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != '현수막 제목 겹침 수정'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix title positions and sizes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(".event-name{position:absolute;top:0;left:0;width:100%;height:24%;", ".event-name{position:absolute;top:0;left:0;width:100%;height:24%;")
          s=s.replace(".event-title{position:absolute;top:31%;left:0;width:100%;height:40%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:4.8cqw;", ".event-title{position:absolute;top:27%;left:0;width:100%;height:40%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:3.8cqw;")
          s=s.replace(".event-sub{position:absolute;top:78%;", ".event-sub{position:absolute;top:74%;")
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '현수막 제목 겹침 수정' || exit 0
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-banner-overlap.yml
          git commit -m 'Remove temporary banner fix workflow'
          git push
