ground:linear-gradient(135deg,transparent 0 47%,rgba(255,211,94,.18) 48% 50%,transparent 51%),linear-gradient(110deg,#11120d,#3c2a18,#17130d)}.bg-sky1{background:radial-gradient(circle at 75% 25%,#fff4aa 0 4%,transparent 5%),radial-gradient(circle at 15% 18%,#fff 0 1%,transparent 2%),radial-gradient(circle at 40% 35%,#fff 0 1%,transparent 2%),linear-gradient(#020a1d,#09234a)}.bg-sky2{background:radial-gradient(circle at 70% 25%,rgba(255,220,120,.95) 0 4%,transparent 5%),repeating-linear-gradient(165deg,transparent 0 15px,rgba(255,210,70,.12) 16px 17px,transparent 18px 45px),linear-gradient(#041126,#0c2d54)}.bg-sky3{background:radial-gradient(ellipse at 50% 100%,rgba(45,120,255,.35),transparent 45%),radial-gradient(circle at 20% 20%,#fff 0 1%,transparent 2%),radial-gradient(circle at 80% 18%,#fff 0 1%,transparent 2%),linear-gradient(#030914,#102c52)}

🛍️ 전통시장 · 장터풍경</option></select><label>내 컴퓨터에서 배경 사진 가져오기</label><input id="filePhoto" type="file" accept="image/*"><div class="file-name" id="fileName">선택된 파일 없음</div><button class="btn file-btn" type="button" id="clearPhoto">✕ 가져온 사진 지우기</button><button class="btn apply" id="apply">⬇ 선택한 디자인 적용</button><div class="btns"><button class="btn preview" id="preview">👁 적용 미리보기</button><button class="btn download" id="download">⬇ 현수막 다운로드(PNG)</button></div></div></aside><main class="stage"><div class="banner-frame" id="banner"><div class="banner-bg" id="bg"></div><div class="side-lights"></div><div class="light-glow"></div><div class="top" id="oTop"></div><div class="title"><div class="event-name" id="oName"></div><div class="event-title" id="oTitle"></div><div class="event-sub" id="oSub"></div></div><div class="info"><div><b>일시</b><span id="oDate"></span>&nbsp;<span id="oTime"></span></div><div><b>장소</b><span id="oPlace"></span></div><div><b>주최</b><span id="oHost"></span></div><div><b>주관</b><span id="oOrg"></span></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const $=id=>document.getElementById(id);let uploadedPhoto='';const bgDesigns={night1:'radial-gradient(circle at 50% 20%,#fff 0 2%,transparent 4%),linear-gradient(#020b1d 0 45%,#0d3b66 100%)',night2:'radial-gradient(circle at 25% 20%,#ffd66b 0 2%,transparent 4%),radial-gradient(circle at 75% 25%,#ffd66b 0 2%,transparent 4%),linear-gradient(#061229,#153e61)',night3:'radial-gradient(circle at 50% 55%,rgba(255,255,255,.18),transparent 20%),linear-gradient(120deg,#07152d,#173d65,#080f25)',stage1:'radial-gradient(ellipse at 50% 100%,#7d36ff 0 8%,transparent 35%),linear-gradient(110deg,#080b20,#172b63,#080b20)',stage2:'radial-gradient(ellipse at 18% 35%,#ff5b28 0 3%,transparent 20%),radial-gradient(ellipse at 82% 35%,#39a8ff 0 3%,transparent 20%),linear-gradient(110deg,#110824,#15234c,#10071e)',stage3:'repeating-linear-gradient(90deg,rgb rcle at 20% 22%,#ffdb70 0 2%,transparent 3%),radial-gradient(circle at 80% 18%,#ff7c52 0 2%,transparent 3%),linear-gradient(115deg,#071d3b,#5a194a,#10183b)',fest6:'repeating-radial-gradient(circle at 50% 65%,rgba(255,205,80,.22) 0 2px,transparent 3px 28px),linear-gradient(#101735,#4d1b46)',golf1:'radial-gradient(ellipse at 60% 75%,#d7e8b0 0 12%,transparent 13%),linear-gradient(170deg,#8bd0ff 0 42%,#477f39 43% 100%)',golf2:'radial-gradient(circle at 72% 64%,#fff 0 3%,transparent 3.5%),linear-gradient(160deg,#b9e8ff 0 48%,#5f9b45 49% 100%)',golf3:'radial-gradient(ellipse at 50% 70%,#f4f2dc 0 7%,transparent 8%),linear-gradient(180deg,#75c7ed 0 48%,#3f7d39 49% 100%)',sport1:'linear-gradient(180deg,#6ec8ff 0 43%,#5a8d38 44% 100%),repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,255,255,.15) 49px 51px)',sport2:'linear-gradient(180deg,#b6e5ff 0 38%,#cfd4d7 39% 52%,#24743d 53% 100%),linear-gradient(90deg,transparent,#fff)',sport3:'radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.65),transparent 18%),linear-gradient(#1d72b7 0 45%,#2c8b45 46% 100%)'};let selectedBg='night1';function fmtDate(v){if(!v)return '';const d=new Date(v+'T00:00:00');return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`}function render(){oTop.textContent=$('top').value;oName.textContent=$('name').value;oTitle.textContent=$('title').value;oSub.textContent=$('sub').value;oDate.textContent=fmtDate($('date').value);oTime.textContent=$('time').value;oPlace.textContent=$('place').value;oHost.textContent=$('host').value;oOrg.textContent=$('organizer').value;const t=$('theme').value,bg=$('bg'),photo=$('photo').value;const map={night:'radial-gradient(circle at 15% 45%,rgba(0,123,255,.5),transparent 25%),radial-gradient(circle at 85% 45%,rgba(255,70,220,.38),transparent 25%),linear-gradient(110deg,#06152d 0%,#0b2851 48%,#06152d 100%)',stage:'radial-gradient(circle at 50% 65%,#6b35d1 0 9%,transparent 32%),linear-gradient(115deg,#090b25,#18205b 50%,#070b18)',festival:'radial-gradient(circle at 50% 20%,#ff7b20 0 4%,transparent 25%),linear-gradient(115deg,#18051e,#4c173b 50%,#070716)',market:'linear-gradient(115deg,#30180b,#71401b 45%,#10100c)'};const p=uploadedPhoto||photo;bg.style.background=p?`linear-gradient(rgba(3,10,22,.62),rgba(3,10,22,.72)),url('${p}') center/cover no-repeat`:(bgDesigns[selectedBg]||map[t]||map.night);document.querySelectorAll('.bg-card').forEach(c=>c.classList.toggle('active',c.dataset.bg===selectedBg))}document.querySelectorAll('.bg-card').forEach(c=>c.onclick=()=>{selectedBg=c.dataset.bg;$('photo').value='';uploadedPhoto='';$('filePhoto').value='';$('fileName').textContent='선택된 파일 없음';render()});['top','name','title','sub','date','time','place','host','organizer','theme','photo'].forEach(id=>{const e=$(id);e.addEventListener('input',render);e.addEventListener('change',render)});$('filePhoto').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{uploadedPhoto=r.result;$('photo').value='';$('fileName').textContent=f.name;render()};r.readAsDataURL(f)});$('clearPhoto').onclick=()=>{uploadedPhoto='';$('filePhoto').value='';$('fileName').textContent='선택된 파일 없음';render()};$('apply').onclick=render;$('preview').onclick=()=>{render();$('banner').scrollIntoView({behavior:'smooth',block:'center'})};$('download').onclick=async()=>{render();const b=$('download');b.disabled=true;b.textContent='⏳ PNG 생성 중...';try{const c=await html2canvas($('banner'),{scale:3,useCORS:true,allowTaint:false,backgroundColor:'#07152d',imageTimeout:15000});const a=document.createElement('a');a.download='행사용_현수막_500x90.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 생성에 실패했습니다. 다시 시도해 주세요.')}finally{b.disabled=false;b.textContent='⬇ 현수막 다운로드(PNG)'}};render();</script></body></html>
