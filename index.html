<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>행사용 현수막 제작 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}header{padding:22px 28px;background:#101d30;border-bottom:1px solid #263b58}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#aebbd0;font-size:13px}.wrap{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 90px)}aside{padding:20px;background:#0d1828;border-right:1px solid #24364f;overflow:auto}.section{border-bottom:1px solid #2a3d56;padding-bottom:18px;margin-bottom:18px}.section h2{font-size:15px;color:#ffd21c;margin:0 0 12px}label{display:block;font-size:12px;color:#dbe4f2;margin:9px 0 5px}input,textarea,select{width:100%;background:#091424;color:#fff;border:1px solid #38506f;border-radius:7px;padding:11px;font-size:13px;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:1px solid #ffd21c;border-radius:7px;padding:12px;font-weight:800;cursor:pointer}.apply{background:#1677dc;color:#fff;border-color:#1677dc;width:100%;margin-top:12px}.preview{background:#243f82;color:#fff}.download{background:#ffd21c;color:#111}.stage{padding:34px;overflow:auto;display:flex;align-items:flex-start;justify-content:center}.banner-frame{width:min(1200px,100%);aspect-ratio:500/90;background:#07152d;border:2px solid #d9a900;box-shadow:0 20px 60px #000;position:relative;overflow:hidden;container-type:inline-size}.banner-bg{position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#244b73 0 7%,transparent 25%),linear-gradient(115deg,#07152d,#122b49 48%,#050c18);background-size:cover;background-position:center;z-index:0}.lights{position:absolute;inset:0;background:repeating-linear-gradient(165deg,transparent 0 28px,rgba(255,210,50,.12) 29px 30px,transparent 31px 70px);z-index:1}.badge{position:absolute;top:4%;left:2%;border:1px solid #ffd21c;color:#ffd21c;padding:.35cqw .75cqw;font-size:1cqw;background:#08152eaa;z-index:8;white-space:nowrap}.top{position:absolute;top:5.5%;left:18%;right:18%;height:8%;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd21c;font-size:2cqw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 3px #000;z-index:3}.title{position:absolute;top:25%;left:0;width:100%;height:40%;z-index:4;text-align:center;text-shadow:3px 4px 0 #000;pointer-events:none}.event-name{position:absolute;top:0;left:0;width:100%;height:24%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2.2cqw;font-family:'Noto Serif KR',serif;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-title{position:absolute;top:27%;left:0;width:100%;height:40%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:3.8cqw;line-height:1;color:#ffd21c;font-family:'Noto Serif KR',serif;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-sub{position:absolute;top:74%;left:0;width:100%;height:18%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.55cqw;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main-img{position:absolute;right:4%;top:17%;width:22%;height:40%;display:flex;justify-content:center;align-items:center;font-size:7cqw;z-index:2}.info{position:absolute;left:3%;right:3%;bottom:4%;height:12%;padding:0 1.2cqw;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:1.4cqw;align-items:center;z-index:7}.info div{font-size:1.25cqw;line-height:1.2;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-shadow:2px 2px 3px #000}.info b{color:#ffd21c;margin:0 .5cqw}.footer{position:absolute;left:3%;right:3%;bottom:18%;height:7%;display:flex;justify-content:space-between;align-items:center;gap:3%;font-size:1.35cqw;font-weight:800;color:#fff;z-index:8}.footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}.footer .right{color:#ffd21c;text-align:right}@media(max-width:900px){.wrap{grid-template-columns:1fr}.stage{padding:12px}.banner-frame{width:100%}}
</style></head><body>
<header><h1>🎪 행사용 현수막 제작 관리자</h1><p>500 × 90cm 가로형 현수막을 행사 정보 입력만으로 제작합니다.</p></header>
<div class="wrap"><aside>
<div class="section"><h2>① 행사 기본정보</h2><label>행사 상단 문구</label><input id="top" value="순천의 밤을 빛내는 특별한 무대!"><label>행사명</label><input id="name" value="아랫장 야시장"><label>행사 제목</label><input id="title" value="특별공연"><label>부제</label><input id="sub" value="순천 아랫장 야시장 특별무대"><div class="grid2"><div><label>일시</label><input id="date" type="date" value="2026-08-28"></div><div><label>시간</label><input id="time" value="18:00~22:00"></div></div><label>장소</label><input id="place" value="순천 아랫장 야시장 특별무대"><label>주최</label><input id="host" value="아랫장상인회"><label>주관</label><input id="organizer" value="가수인생활 엔터테인먼트"><label>왼쪽 하단 문구</label><input id="left" value="☆ 아랫장야시장에서 만나요! ♪"><label>오른쪽 하단 문구</label><input id="right" value="많은 관심과 참여 부탁드립니다!"></div>
<div class="section"><h2>② 현수막 디자인</h2><label>기본 디자인</label><select id="theme"><option value="night">야시장 · 야간조명</option><option value="stage">공연 · 무대조명</option><option value="festival">축제 · 불꽃</option><option value="market">전통시장 · 거리</option></select><label>배경 사진 선택</label><select id="photo"><option value="">사진 없음 · 기본 배경</option><option value="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?auto=format&fit=crop&w=1600&q=85">🏮 야시장 · 따뜻한 전구조명</option><option value="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1600&q=85">🎉 야외축제 · 무대와 관객</option><option value="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1600&q=85">🎤 공연 · 화려한 무대조명</option><option value="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1600&q=85">🌃 야간거리 · 도시조명</option><option value="https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1600&q=85">🛍️ 전통시장 · 장터풍경</option></select><button class="btn apply" id="apply">⬇ 선택한 디자인 적용</button><div class="btns"><button class="btn preview" id="preview">👁 적용 미리보기</button><button class="btn download" id="download">⬇ 현수막 다운로드(PNG)</button></div></div>
</aside><main class="stage"><div class="banner-frame" id="banner"><div class="banner-bg" id="bg"></div><div class="lights"></div><div class="badge">500 × 90cm · 행사 현수막</div><div class="top" id="oTop"></div><div class="title"><div class="event-name" id="oName"></div><div class="event-title" id="oTitle"></div><div class="event-sub" id="oSub"></div></div><div class="main-img">🎤</div><div class="info"><div>📅 <b>일시</b><span id="oDate"></span> <span id="oTime"></span></div><div>📍 <b>장소</b><span id="oPlace"></span></div><div>📣 <b>주관</b><span id="oOrg"></span></div></div><div class="footer"><span id="oLeft"></span><span class="right" id="oRight"></span></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const $=id=>document.getElementById(id);function fmtDate(v){if(!v)return '';const d=new Date(v+'T00:00:00');return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}function render(){$('oTop').textContent=$('top').value;$('oName').textContent=$('name').value;$('oTitle').textContent=$('title').value;$('oSub').textContent=$('sub').value;$('oDate').textContent=fmtDate($('date').value);$('oTime').textContent=$('time').value;$('oPlace').textContent=$('place').value;$('oOrg').textContent=$('organizer').value;$('oLeft').textContent=$('left').value;$('oRight').textContent=$('right').value;const t=$('theme').value,bg=$('bg');const map={night:'radial-gradient(circle at 20% 25%,#254d74 0 8%,transparent 27%),linear-gradient(115deg,#06152d,#143b5b 48%,#050b16)',stage:'radial-gradient(circle at 55% 70%,#6334c9 0 8%,transparent 32%),linear-gradient(115deg,#090b25,#18205b 50%,#070b18)',festival:'radial-gradient(circle at 50% 20%,#ff7b20 0 4%,transparent 25%),linear-gradient(115deg,#18051e,#4c173b 50%,#070716)',market:'linear-gradient(115deg,#30180b,#71401b 45%,#10100c)'};const photo=$('photo').value;bg.style.background=photo?`linear-gradient(rgba(3,10,22,.48),rgba(3,10,22,.58)),url('${photo}') center/cover no-repeat`:map[t]||map.night}['top','name','title','sub','date','time','place','host','organizer','left','right','theme','photo'].forEach(id=>{const e=$(id);e.addEventListener('input',render);e.addEventListener('change',render)});$('apply').onclick=render;$('preview').onclick=()=>{render();$('banner').scrollIntoView({behavior:'smooth',block:'center'})};$('download').onclick=async()=>{render();const b=$('download');b.disabled=true;b.textContent='⏳ PNG 생성 중...';try{const c=await html2canvas($('banner'),{scale:3,useCORS:true,backgroundColor:'#07152d'});const a=document.createElement('a');a.download='행사용_현수막_500x90.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 생성에 실패했습니다. 다시 시도해 주세요.')}finally{b.disabled=false;b.textContent='⬇ 현수막 다운로드(PNG)'}};render();</script></body></html>
