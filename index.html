<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>행사용 현수막 제작 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}header{padding:22px 28px;background:#101d30;border-bottom:1px solid #263b58}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#aebbd0;font-size:13px}.wrap{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 90px)}aside{padding:20px;background:#0d1828;border-right:1px solid #24364f;overflow:auto}.section{border-bottom:1px solid #2a3d56;padding-bottom:18px;margin-bottom:18px}.section h2{font-size:15px;color:#ffd21c;margin:0 0 12px}label{display:block;font-size:12px;color:#dbe4f2;margin:9px 0 5px}input,textarea,select{width:100%;background:#091424;color:#fff;border:1px solid #38506f;border-radius:7px;padding:11px;font-size:13px;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:1px solid #ffd21c;border-radius:7px;padding:12px;font-weight:800;cursor:pointer}.apply{background:#1677dc;color:#fff;border-color:#1677dc;width:100%;margin-top:12px}.preview{background:#243f82;color:#fff}.download{background:#ffd21c;color:#111}.stage{padding:34px;overflow:auto;display:flex;align-items:flex-start;justify-content:center}.banner-frame{width:min(1400px,100%);aspect-ratio:500/90;background:#06152d;border:2px solid #d9a900;box-shadow:0 20px 60px #000;position:relative;overflow:hidden;container-type:inline-size}.banner-bg{position:absolute;inset:0;background:radial-gradient(circle at 15% 45%,rgba(0,123,255,.5),transparent 25%),radial-gradient(circle at 85% 45%,rgba(255,70,220,.38),transparent 25%),linear-gradient(110deg,#06152d 0%,#0b2851 48%,#06152d 100%);background-size:cover;background-position:center;z-index:0}.banner-frame:before,.banner-frame:after{content:"";position:absolute;top:0;width:30%;height:100%;z-index:1;pointer-events:none}.banner-frame:before{left:0;background:repeating-linear-gradient(165deg,transparent 0 27px,rgba(255,210,70,.14) 28px 30px,transparent 31px 66px)}.banner-frame:after{right:0;background:repeating-linear-gradient(15deg,transparent 0 27px,rgba(255,210,70,.14) 28px 30px,transparent 31px 66px)}.side-lights{position:absolute;inset:0;z-index:2;pointer-events:none}.side-lights:before,.side-lights:after{content:"";position:absolute;top:0;width:27%;height:58%;opacity:.95}.side-lights:before{left:-2%;background:radial-gradient(ellipse at 12% 28%,rgba(255,220,150,.95) 0 1%,rgba(255,190,70,.38) 2% 4%,transparent 11%),radial-gradient(ellipse at 23% 34%,rgba(70,180,255,.9) 0 1%,rgba(40,120,255,.32) 2% 5%,transparent 13%),linear-gradient(25deg,transparent 42%,rgba(90,170,255,.18) 43% 44%,transparent 45%)}.side-lights:after{right:-2%;transform:scaleX(-1);background:radial-gradient(ellipse at 12% 28%,rgba(255,220,150,.95) 0 1%,rgba(255,190,70,.38) 2% 4%,transparent 11%),radial-gradient(ellipse at 23% 34%,rgba(70,180,255,.9) 0 1%,rgba(40,120,255,.32) 2% 5%,transparent 13%),linear-gradient(25deg,transparent 42%,rgba(90,170,255,.18) 43% 44%,transparent 45%)}.light-glow{position:absolute;top:0;left:0;right:0;height:8%;z-index:3;border-top:2px solid rgba(255,210,70,.8);box-shadow:0 0 20px rgba(255,190,40,.3)}.top{position:absolute;top:3%;left:30%;right:30%;height:5%;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd21c;font-size:1.05cqw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 2px 2px #000;z-index:6}.title{position:absolute;top:16%;left:0;width:100%;height:48%;z-index:7;text-align:center;text-shadow:4px 4px 0 #000;pointer-events:none}.event-name{position:absolute;top:0;left:0;width:100%;height:20%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2.6cqw;line-height:1;font-family:'Noto Serif KR',serif;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-title{position:absolute;top:27%;left:0;width:100%;height:39%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:6.1cqw;line-height:1;color:#ffd21c;font-family:'Noto Serif KR',serif;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.06em}.event-sub{position:absolute;top:73%;left:0;width:100%;height:21%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2.15cqw;line-height:1.05;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{position:absolute;left:5%;right:5%;bottom:13%;height:10%;display:flex;align-items:center;justify-content:center;gap:2.5%;z-index:8;font-size:1.45cqw;font-weight:800;text-shadow:1px 1px 2px #000}.info>div{height:auto;border:0;background:transparent;padding:0;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.info b{flex:0 0 auto;background:transparent;color:#ffd21c;padding:0;margin-right:.35cqw;font-size:1.45cqw;text-shadow:1px 1px 2px #000}.info span{overflow:hidden;text-overflow:ellipsis}.footer{position:absolute;left:5%;right:5%;bottom:3%;height:7%;display:flex;align-items:center;justify-content:center;gap:3%;background:transparent;border:0;color:#fff;z-index:9;font-size:1.35cqw;font-weight:800;text-shadow:1px 1px 2px #000}.footer>span{height:auto;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:0;padding:0;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:1px 1px 2px #000}.footer>span+span{border-left:0}.footer b{flex:0 0 auto;background:transparent;color:#ffd21c;border-radius:0;padding:0;margin-right:.35cqw;font-size:1.35cqw;text-shadow:1px 1px 2px #000}.footer .right{color:#fff;text-align:center}@media(max-width:900px){.wrap{grid-template-columns:1fr}.stage{padding:12px}.banner-frame{width:100%}}
</style></head><body>
<header><h1>🎪 행사용 현수막 제작 관리자</h1><p>500 × 90cm 가로형 현수막을 행사 정보 입력만으로 제작합니다.</p></header>
<div class="wrap"><aside>
<div class="section"><h2>① 행사 기본정보</h2><label>행사 상단 문구</label><input id="top" value="순천의 밤을 빛내는 특별한 무대!"><label>행사명</label><input id="name" value="아랫장 야시장"><label>행사 제목</label><input id="title" value="특별공연"><label>부제</label><input id="sub" value="순천 아랫장 야시장 특별무대"><div class="grid2"><div><label>일시</label><input id="date" type="date" value="2026-08-29"></div><div><label>시간</label><input id="time" value="19:00"></div></div><label>장소</label><input id="place" value="순천 아랫장 야시장 야외무대"><label>주최</label><input id="host" value="아랫장상인회"><label>주관</label><input id="organizer" value="가수인생활 엔터테인먼트"></div>
<div class="section"><h2>② 현수막 디자인</h2><label>기본 디자인</label><select id="theme"><option value="night">야시장 · 야간조명</option><option value="stage">공연 · 무대조명</option><option value="festival">축제 · 불꽃</option><option value="market">전통시장 · 거리</option></select><label>배경 사진 선택</label><select id="photo"><option value="">사진 없음 · 기본 배경</option><option value="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?auto=format&fit=crop&w=1600&q=85">🏮 야시장 · 따뜻한 전구조명</option><option value="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1600&q=85">🎉 야외축제 · 무대와 관객</option><option value="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1600&q=85">🎤 공연 · 화려한 무대조명</option><option value="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1600&q=85">🌃 야간거리 · 도시조명</option><option value="https://images.unsplash.com/photo-1488459716781-31db52582fe9?auto=format&fit=crop&w=1600&q=85">🛍️ 전통시장 · 장터풍경</option></select><button class="btn apply" id="apply">⬇ 선택한 디자인 적용</button><div class="btns"><button class="btn preview" id="preview">👁 적용 미리보기</button><button class="btn download" id="download">⬇ 현수막 다운로드(PNG)</button></div></div>
</aside><main class="stage"><div class="banner-frame" id="banner"><div class="banner-bg" id="bg"></div><div class="side-lights"></div><div class="light-glow"></div><div class="top" id="oTop"></div><div class="title"><div class="event-name" id="oName"></div><div class="event-title" id="oTitle"></div><div class="event-sub" id="oSub"></div></div><div class="info"><div><b>일시</b><span id="oDate"></span>&nbsp;<span id="oTime"></span></div><div><b>장소</b><span id="oPlace"></span></div><div><b>출연</b><span>나가수공연단</span></div></div><div class="footer"><span><b>주최</b><span id="oHost"></span></span><span class="right"><b>주관</b><span id="oOrg"></span></span></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const $=id=>document.getElementById(id);function fmtDate(v){if(!v)return '';const d=new Date(v+'T00:00:00');return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`}function render(){$('oTop').textContent=$('top').value;$('oName').textContent=$('name').value;$('oTitle').textContent=$('title').value;$('oSub').textContent=$('sub').value;$('oDate').textContent=fmtDate($('date').value);$('oTime').textContent=$('time').value;$('oPlace').textContent=$('place').value;$('oHost').textContent=$('host').value;$('oOrg').textContent=$('organizer').value;const t=$('theme').value,bg=$('bg');const map={night:'radial-gradient(circle at 15% 45%,rgba(0,123,255,.5),transparent 25%),radial-gradient(circle at 85% 45%,rgba(255,70,220,.38),transparent 25%),linear-gradient(110deg,#06152d 0%,#0b2851 48%,#06152d 100%)',stage:'radial-gradient(circle at 50% 65%,#6b35d1 0 9%,transparent 32%),linear-gradient(115deg,#090b25,#18205b 50%,#070b18)',festival:'radial-gradient(circle at 50% 20%,#ff7b20 0 4%,transparent 25%),linear-gradient(115deg,#18051e,#4c173b 50%,#070716)',market:'linear-gradient(115deg,#30180b,#71401b 45%,#10100c)'};const photo=$('photo').value;bg.style.background=photo?`linear-gradient(rgba(3,10,22,.35),rgba(3,10,22,.48)),url('${photo}') center/cover no-repeat`:map[t]||map.night}['top','name','title','sub','date','time','place','host','organizer','theme','photo'].forEach(id=>{const e=$(id);e.addEventListener('input',render);e.addEventListener('change',render)});$('apply').onclick=render;$('preview').onclick=()=>{render();$('banner').scrollIntoView({behavior:'smooth',block:'center'})};$('download').onclick=async()=>{render();const b=$('download');b.disabled=true;b.textContent='⏳ PNG 생성 중...';try{const c=await html2canvas($('banner'),{scale:3,useCORS:true,backgroundColor:'#07152d'});const a=document.createElement('a');a.download='행사용_현수막_500x90.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 생성에 실패했습니다. 다시 시도해 주세요.')}finally{b.disabled=false;b.textContent='⬇ 현수막 다운로드(PNG)'}};render();</script></body></html>
