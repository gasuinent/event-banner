<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전통시장 상생 상품권 제작 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}header{padding:20px 28px;background:#101d30;border-bottom:1px solid #2b405d}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#b9c5d6;font-size:13px}.wrap{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 86px)}aside{padding:18px;background:#0d1828;border-right:1px solid #263a54;overflow:auto}.section{border-bottom:1px solid #2a3d56;padding-bottom:17px;margin-bottom:17px}.section h2{font-size:15px;color:#ffd21c;margin:0 0 11px}label{display:block;font-size:12px;color:#dce5f2;margin:8px 0 4px}input,textarea,select{width:100%;background:#091424;color:#fff;border:1px solid #38506f;border-radius:7px;padding:10px;font-size:13px}textarea{resize:vertical;min-height:60px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:7px;padding:12px;font-weight:900;cursor:pointer;margin-top:9px}.apply{background:#1677dc;color:#fff}.download{background:#ffd21c;color:#111}.stage{padding:28px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}.a4{width:min(900px,100%);background:#fff;padding:16px;box-shadow:0 10px 40px #000;display:grid;grid-template-columns:1fr 1fr;gap:8px}.coupon{position:relative;aspect-ratio:154/68;border:1.4px solid #273746;background:#fbf8ee;color:#222;overflow:hidden;padding:4.5% 5% 3.5%;font-family:'Noto Sans KR',Arial,sans-serif}.coupon:before{content:"";position:absolute;inset:3px;border:1px solid #b8954b;pointer-events:none}.market{position:absolute;left:0;right:0;bottom:13%;height:33%;opacity:.72;background:linear-gradient(180deg,transparent,#f1dfbb 72%),linear-gradient(90deg,#d9b47b 0 9%,#f2d7a8 9% 18%,#c99c66 18% 27%,#f4dcb4 27% 37%,#d4ad76 37% 48%,#f2d5a0 48% 59%,#c79b63 59% 69%,#f3d9ac 69% 80%,#c79a64 80% 90%,#f0d4a4 90%);filter:saturate(.8)}.market:after{content:"전 통 시 장";position:absolute;left:36%;top:22%;font-size:clamp(7px,1.15vw,13px);font-weight:900;letter-spacing:.4em;color:#8d6a38}.logo{position:absolute;left:5%;top:7%;font-size:clamp(7px,1.1vw,12px);font-weight:900;letter-spacing:.08em;color:#172c29}.logo small{display:block;font-size:.72em;margin-top:2px}.ctitle{position:absolute;top:6%;left:17%;right:5%;text-align:center;font-size:clamp(9px,1.65vw,18px);font-weight:900;white-space:nowrap}.amount{position:absolute;top:20%;left:10%;right:10%;text-align:center;font-size:clamp(17px,3.7vw,40px);line-height:1;font-weight:900;color:#c85b2a;white-space:nowrap}.usage{position:absolute;top:40%;left:8%;right:8%;text-align:center;font-size:clamp(6px,.9vw,10px);font-weight:700;white-space:nowrap;z-index:2}.bottom{position:absolute;left:6%;right:6%;bottom:3%;height:12%;display:flex;align-items:flex-end;justify-content:space-between;z-index:3;font-size:clamp(5px,.78vw,9px);font-weight:700}.issuer{position:absolute;left:42%;bottom:3%;border:1px dashed #444;padding:2px 7px;background:rgba(255,255,255,.8);font-size:clamp(5px,.72vw,8px);font-weight:800;text-align:center}.seal{position:absolute;right:5%;bottom:4%;width:9%;aspect-ratio:1;border:1px solid #b64c4c;color:#b64c4c;display:flex;align-items:center;justify-content:center;font-size:clamp(5px,.7vw,8px);font-weight:900;transform:rotate(-7deg);z-index:4}.serial{position:absolute;left:5%;bottom:1%;font-size:clamp(4px,.6vw,7px);color:#666;z-index:4}.cut{position:absolute;inset:0;pointer-events:none;border:1px dashed rgba(70,70,70,.35)}@media(max-width:900px){.wrap{grid-template-columns:1fr}.stage{padding:10px}.a4{width:100%;padding:8px;gap:5px}}
</style></head><body><header><h1>🎟️ 전통시장 상생 상품권 제작 관리자</h1><p>A4 용지에 실제 상품권 크기로 여러 장을 배치하여 인쇄할 수 있습니다.</p></header><div class="wrap"><aside><div class="section"><h2>① 상품권 기본정보</h2><label>상품권 제목</label><input id="title" value="전통시장 소상공인 상생 상품권"><label>금액</label><input id="amount" value="10,000"><label>금액 한글</label><input id="amountKor" value="일만원"><label>사용 안내</label><input id="usage" value="본 상품권은 전통시장 및 소상공인 가맹점에서 사용 가능합니다."><div class="grid2"><div><label>발행일</label><input id="issue" value="2026. 8. 29."></div><div><label>유효기간</label><input id="valid" value="발행일로부터 1개월 이내"></div></div><label>발행처</label><input id="issuer" value="한국가수인생활협회 / 나가수공연단·봉사단"></div><div class="section"><h2>② 디자인</h2><label>시장 이미지</label><select id="design"><option value="market">전통시장 따뜻한 장터</option><option value="market2">전통시장 골목</option><option value="market3">시장 야간풍경</option></select><label>로고 문구</label><input id="logo" value="KSLA · 한국가수인생활협회"><label>인쇄 매수</label><select id="count"><option value="8">8매 · A4 2×4</option><option value="6">6매 · A4 2×3</option><option value="4">4매 · A4 2×2</option></select><button class="btn apply" id="apply">⬇ 선택한 디자인 적용</button><button class="btn download" id="download">⬇ A4 상품권 PNG 다운로드</button></div></aside><main class="stage"><div class="a4" id="sheet"></div></main></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const $=id=>document.getElementById(id);const sheet=$('sheet');function render(){const n=parseInt($('count').value);sheet.innerHTML='';sheet.style.gridTemplateColumns=n<=4?'1fr 1fr':'1fr 1fr';for(let i=1;i<=n;i++){const c=document.createElement('div');c.className='coupon';c.innerHTML=`<div class="cut"></div><div class="logo">${$('logo').value}<small>상생프로젝트</small></div><div class="ctitle">${$('title').value}</div><div class="amount">₩ ${$('amount').value} <small>(${ $('amountKor').value })</small></div><div class="usage">${$('usage').value}</div><div class="market"></div><div class="bottom"><span>발행일 : ${$('issue').value}<br>유효기간 : ${$('valid').value}</span><span class="serial">관리번호 : ${String(i).padStart(4,'0')}</span></div><div class="issuer">${$('issuer').value}</div><div class="seal">상생<br>인증</div>`;sheet.appendChild(c)}}['title','amount','amountKor','usage','issue','valid','issuer','logo','count','design'].forEach(id=>$(id).addEventListener('input',render));['count','design'].forEach(id=>$(id).addEventListener('change',render));$('apply').onclick=render;$('download').onclick=async()=>{render();const b=$('download');b.disabled=true;b.textContent='⏳ A4 PNG 생성 중...';try{const canvas=await html2canvas(sheet,{scale:3,backgroundColor:'#fff'});const a=document.createElement('a');a.download='전통시장_상생상품권_A4.png';a.href=canvas.toDataURL('image/png');a.click()}finally{b.disabled=false;b.textContent='⬇ A4 상품권 PNG 다운로드'}};render();</script></body></html>
