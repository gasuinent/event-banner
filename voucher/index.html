<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전통시장 상생 상품권 제작 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}header{padding:20px 28px;background:#101d30;border-bottom:1px solid #2b405d}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#b9c5d6;font-size:13px}.wrap{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 86px)}aside{padding:18px;background:#0d1828;border-right:1px solid #263a54;overflow:auto}.section{border-bottom:1px solid #2a3d56;padding-bottom:17px;margin-bottom:17px}.section h2{font-size:15px;color:#ffd21c;margin:0 0 11px}label{display:block;font-size:12px;color:#dce5f2;margin:8px 0 4px}input,textarea,select{width:100%;background:#091424;color:#fff;border:1px solid #38506f;border-radius:7px;padding:10px;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:7px;padding:12px;font-weight:900;cursor:pointer;margin-top:9px}.apply{background:#1677dc;color:#fff}.download{background:#ffd21c;color:#111}.stage{padding:28px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}.a4{width:210mm;min-height:297mm;max-width:100%;background:#fff;padding:7mm 0;box-shadow:0 10px 40px #000;display:grid;grid-template-columns:148mm;grid-template-rows:repeat(4,68mm);gap:3mm;justify-content:center}.coupon{position:relative;width:148mm;height:68mm;border:1.5px solid #6d5128;background:#fffaf0;color:#222;overflow:hidden;padding:4.5% 5% 3.5%;font-family:'Noto Sans KR',Arial,sans-serif}.coupon:before{content:"";position:absolute;inset:3px;border:1px solid #b8954b;pointer-events:none;z-index:5}.market{position:absolute;left:0;right:0;bottom:0;height:48%;overflow:hidden;background:linear-gradient(180deg,rgba(255,250,230,.05),rgba(246,222,177,.95)),linear-gradient(180deg,#b9d5df 0 28%,#d9c18d 28% 31%,#d0a56c 31% 100%);z-index:0}.market:before{content:"";position:absolute;left:0;right:0;top:7%;height:58%;background:linear-gradient(135deg,transparent 0 12%,#c34e32 12% 25%,#f0b34d 25% 38%,#3d7b54 38% 51%,#d65c43 51% 64%,#e2a343 64% 77%,#47765a 77% 90%,transparent 90%),linear-gradient(180deg,#f7e8c6 0 22%,transparent 22%);opacity:.92}.market:after{content:"전통시장   •   맛있는 먹거리   •   따뜻한 장터";position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#74552c;font-size:clamp(6px,.85vw,10px);font-weight:900;letter-spacing:.12em;text-shadow:0 1px #fff}.awning{position:absolute;left:3%;right:3%;top:4%;height:22%;background:repeating-linear-gradient(90deg,#bd4938 0 7%,#f4d58c 7% 14%,#3e7255 14% 21%,#f4d58c 21% 28%);border-bottom:2px solid #79552c;z-index:1}.sign{position:absolute;top:3%;left:39%;width:22%;height:22%;background:#fff5d8;border:1px solid #9c773d;border-radius:3px;text-align:center;padding-top:2%;font-size:clamp(6px,.85vw,10px);font-weight:900;color:#574326;z-index:2}.lantern{position:absolute;right:5%;top:2%;font-size:clamp(13px,2vw,25px);z-index:3}.logo{position:absolute;left:5%;top:7%;font-size:clamp(7px,1.1vw,12px);font-weight:900;letter-spacing:.03em;color:#17352d;z-index:4}.logo small{display:block;font-size:.72em;margin-top:2px}.ctitle{position:absolute;top:6%;left:17%;right:5%;text-align:center;font-size:clamp(9px,1.65vw,18px);font-weight:900;white-space:nowrap;z-index:4}.amount{position:absolute;top:20%;left:10%;right:10%;text-align:center;font-size:clamp(17px,3.7vw,40px);line-height:1;font-weight:900;color:#b85228;white-space:nowrap;z-index:4}.amount small{font-size:.48em}.usage{position:absolute;top:40%;left:8%;right:8%;text-align:center;font-size:clamp(6px,.9vw,10px);font-weight:700;white-space:nowrap;z-index:4}.bottom{position:absolute;left:6%;right:6%;bottom:3%;height:12%;display:flex;align-items:flex-end;justify-content:space-between;z-index:6;font-size:clamp(5px,.78vw,9px);font-weight:700}.issuer{position:absolute;left:42%;bottom:3%;border:1px dashed #444;padding:2px 7px;background:rgba(255,255,255,.9);font-size:clamp(5px,.72vw,8px);font-weight:800;text-align:center;z-index:7}.seal{position:absolute;right:5%;bottom:4%;width:9%;aspect-ratio:1;border:1px solid #b64c4c;color:#b64c4c;background:rgba(255,250,240,.85);display:flex;align-items:center;justify-content:center;font-size:clamp(5px,.7vw,8px);font-weight:900;transform:rotate(-7deg);z-index:7;border-radius:50%}.serial{position:absolute;left:5%;bottom:1%;font-size:clamp(4px,.6vw,7px);color:#666;z-index:7}.cut{position:absolute;inset:0;pointer-events:none;border:1px dashed rgba(70,70,70,.35);z-index:8}@media(max-width:900px){.wrap{grid-template-columns:1fr}.stage{padding:10px}.a4{width:100%;min-height:auto;grid-template-columns:1fr;grid-template-rows:repeat(4,auto);padding:8px}.coupon{width:100%;height:auto;aspect-ratio:148/68}}
</style></head><body><header><h1>🎟️ 전통시장 상생 상품권 제작 관리자</h1><p>A4 세로 용지에 실제 10,000원권 지폐와 동일한 148 × 68mm 규격으로 4장을 배치합니다.</p></header><div class="wrap"><aside><div class="section"><h2>① 상품권 기본정보</h2><label>상품권 제목</label><input id="title" value="전통시장 소상공인 상생 상품권"><label>금액</label><input id="amount" value="10,000"><label>금액 한글</label><input id="amountKor" value="일만원"><label>사용 안내</label><input id="usage" value="본 상품권은 전통시장 및 소상공인 가맹점에서 사용 가능합니다."><div class="grid2"><div><label>발행일</label><input id="issue" value="2026. 8. 29."></div><div><label>유효기간</label><input id="valid" value="발행일로부터 1개월 이내"></div></div><label>발행처</label><input id="issuer" value="가수인생활엔터테인먼트"></div><div class="section"><h2>② 디자인</h2><label>시장 이미지</label><select id="design"><option value="market">전통시장 거리 ①</option><option value="market2">전통시장 골목 ②</option><option value="market3">전통시장 야간 ③</option></select><label>로고 문구</label><input id="logo" value="가수인생활엔터테인먼트"><label>인쇄 매수</label><select id="count"><option value="4">4매 · A4 세로 1×4</option></select><button class="btn apply" id="apply">⬇ 선택한 디자인 적용</button><button class="btn download" id="download">⬇ A4 상품권 PNG 다운로드</button></div></aside><main class="stage"><div class="a4" id="sheet"></div></main></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const $=id=>document.getElementById(id),sheet=$('sheet');function render(){sheet.innerHTML='';for(let i=1;i<=4;i++){const c=document.createElement('div');c.className='coupon';c.innerHTML=`<div class="cut"></div><div class="logo">${$('logo').value}<small>상생프로젝트</small></div><div class="ctitle">${$('title').value}</div><div class="amount">₩ ${$('amount').value} <small>(${$('amountKor').value})</small></div><div class="usage">${$('usage').value}</div><div class="market"><div class="awning"></div><div class="sign">전통시장</div><div class="lantern">🏮</div></div><div class="bottom"><span>발행일 : ${$('issue').value}<br>유효기간 : ${$('valid').value}</span><span class="serial">관리번호 : ${String(i).padStart(4,'0')}</span></div><div class="issuer">${$('issuer').value}</div><div class="seal">상생<br>인증</div>`;sheet.appendChild(c)}}['title','amount','amountKor','usage','issue','valid','issuer','logo','design'].forEach(id=>$(id).addEventListener('input',render));['design','count'].forEach(id=>$(id).addEventListener('change',render));$('apply').onclick=render;$('download').onclick=async()=>{render();const b=$('download');b.disabled=true;b.textContent='⏳ A4 PNG 생성 중...';try{const canvas=await html2canvas(sheet,{scale:3,backgroundColor:'#fff'});const a=document.createElement('a');a.download='전통시장_상생상품권_A4_세로4매_148x68mm.png';a.href=canvas.toDataURL('image/png');a.click()}finally{b.disabled=false;b.textContent='⬇ A4 상품권 PNG 다운로드'}};render();</script></body></html>
