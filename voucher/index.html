<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전통시장 상생 상품권 제작 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}header{padding:20px 28px;background:#101d30;border-bottom:1px solid #2b405d}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#b9c5d6;font-size:13px}.wrap{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 86px)}aside{padding:18px;background:#0d1828;border-right:1px solid #263a54;overflow:auto}.section{border-bottom:1px solid #2a3d56;padding-bottom:17px;margin-bottom:17px}.section h2{font-size:15px;color:#ffd21c;margin:0 0 11px}label{display:block;font-size:12px;color:#dce5f2;margin:8px 0 4px}input,select{width:100%;background:#091424;color:#fff;border:1px solid #38506f;border-radius:7px;padding:10px;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;border:0;border-radius:7px;padding:12px;font-weight:900;cursor:pointer;margin-top:9px}.apply{background:#1677dc;color:#fff}.download{background:#ffd21c;color:#111}.stage{padding:28px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}.a4{width:210mm;min-height:297mm;max-width:100%;background:#fff;padding:7mm 0;box-shadow:0 10px 40px #000;display:grid;grid-template-columns:148mm;grid-template-rows:repeat(4,68mm);gap:3mm;justify-content:center}.coupon{position:relative;width:148mm;height:68mm;border:1.5px solid #b8954b;background:#222;color:#fff;overflow:hidden;font-family:'Noto Sans KR',Arial,sans-serif}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}.photoShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.08) 45%,rgba(0,0,0,.55));z-index:1}.frame{position:absolute;inset:5px;border:1px solid rgba(255,220,125,.85);z-index:8}.project{position:absolute;left:14%;right:14%;top:6%;text-align:center;font-size:clamp(11px,1.8vw,20px);font-weight:900;color:#ffd21c;white-space:nowrap;text-shadow:0 2px 6px #000;z-index:5}.ctitle{left:15%;right:15%;top:15%;text-align:center;font-size:clamp(8px,1.25vw,14px);font-weight:900;white-space:nowrap;text-shadow:0 2px 6px #000;z-index:5}.amount{position:absolute;left:8%;right:8%;top:25%;text-align:center;font-size:clamp(23px,4.5vw,47px);font-weight:900;color:#ffe39a;white-space:nowrap;text-shadow:0 2px 7px #000;z-index:5}.amount small{font-size:.38em;color:#fff}.usage{position:absolute;left:7%;right:7%;top:49%;text-align:center;font-size:clamp(10px,1.45vw,16px);font-weight:900;white-space:nowrap;text-shadow:0 2px 6px #000;z-index:5}.info{position:absolute;left:7%;bottom:6%;font-size:clamp(5px,.72vw,8px);font-weight:700;line-height:1.45;text-shadow:0 2px 5px #000;z-index:5}.issuer{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:clamp(9px,1.05vw,12px);font-weight:900;white-space:nowrap;color:#fff;text-shadow:0 2px 6px #000;z-index:5}.serial{position:absolute;right:7%;bottom:6%;display:flex;align-items:center;gap:4px;font-size:clamp(6px,.75vw,9px);font-weight:900;text-shadow:0 2px 5px #000;z-index:5}.serial b{background:#fff;color:#c00;padding:2px 7px;border-radius:4px;font-size:clamp(8px,1vw,11px);text-shadow:none}.seal{position:absolute;right:7%;bottom:23%;width:8%;aspect-ratio:1;border:1px solid #ffe39a;color:#ffe39a;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(5px,.65vw,7px);font-weight:900;transform:rotate(-7deg);border-radius:50%;z-index:5}.credit{position:absolute;left:7%;bottom:2%;z-index:7;font-size:4px;color:#fff}.cut{position:absolute;inset:0;border:1px dashed rgba(255,255,255,.3);z-index:9}@media(max-width:900px){.wrap{grid-template-columns:1fr}.stage{padding:10px}.a4{width:100%;min-height:auto;grid-template-columns:1fr;grid-template-rows:repeat(4,auto);padding:8px}.coupon{width:100%;height:auto;aspect-ratio:148/68}}</style></head><body><header><h1>🎟️ 전통시장 상생 상품권 제작 관리자</h1><p>실제 전통시장 사진을 상품권 전체 배경으로 적용합니다.</p></header><div class="wrap"><aside><div class="section"><h2>① 상품권 기본정보</h2><label>상품권 제목</label><input id="title" value="전통시장 소상공인 상생 상품권"><label>금액</label><input id="amount" value="10,000"><label>금액 한글</label><input id="amountKor" value="일만원"><label>사용 안내 (글자 색상 적용)</label><input id="usage" value="본 상품권은 전통시장 서부시장 내에서만 사용 가능합니다."><label>사용 안내 글자 색상</label><input id="usageColor" type="color" value="#ffd21c"><div class="grid2"><div><label>발행일</label><input id="issue" value="2026. 8. 27."></div><div><label>유효기간</label><input id="valid" value="발행일로부터 1개월 이내"></div></div><label>발행처</label><input id="issuer" value="가수인생활 엔터테인먼트"><label>관리번호 (첫 번호 직접 입력)</label><input id="serialStart" value="0001" maxlength="4" inputmode="numeric"></div><div class="section"><h2>② 디자인 설정</h2><label>상생 프로젝트 문구</label><input id="project" value="전통시장 상생프로젝트"><label>전통시장 사진</label><select id="design"><option value="market">부산 중구 야시장</option><option value="market2">서울 명동 야시장</option><option value="market3">서울 명동 야시장 2</option></select><label>인쇄 매수</label><select id="count"><option value="4">4매 · A4 세로 1×4</option></select><button class="btn apply" id="apply">✓ 미리보기 적용</button><button class="btn download" id="download">⬇ A4 상품권 PNG 다운로드</button></div></aside><main class="stage"><div class="a4" id="sheet"></div></main></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const $=id=>document.getElementById(id),sheet=$('sheet');const photos={market:{url:'https://commons.wikimedia.org/wiki/Special:FilePath/Night_market_in_Jung-gu%2C_Busan.jpg?width=1600',credit:'사진: Christophe95 / Wikimedia Commons · CC BY-SA 4.0'},market2:{url:'https://commons.wikimedia.org/wiki/Special:FilePath/Myeongdong_night_market_seoul_3.jpg?width=1600',credit:'사진: Sgroey / Wikimedia Commons · CC BY-SA 4.0'},market3:{url:'https://commons.wikimedia.org/wiki/Special:FilePath/Myeongdong_night_market_seoul_4.jpg?width=1600',credit:'사진: Sgroey / Wikimedia Commons · CC BY-SA 4.0'}};function render(){sheet.innerHTML='';const d=photos[$('design').value];let start=parseInt(($('serialStart').value||'0001').replace(/\D/g,''),10);if(isNaN(start))start=1;for(let i=0;i<4;i++){const c=document.createElement('div');c.className='coupon';const no=String(start+i).padStart(4,'0');c.innerHTML='<img class="photo" src="'+d.url+'" alt="전통시장 배경사진"><div class="photoShade"></div><div class="frame"></div><div class="cut"></div><div class="project">'+$('project').value+'</div><div class="ctitle">'+$('title').value+'</div><div class="amount">₩ '+$('amount').value+' <small>('+$('amountKor').value+')</small></div><div class="usage" style="color:'+$('usageColor').value+'">'+$('usage').value+'</div><div class="info">발행일 : '+$('issue').value+'<br>유효기간 : '+$('valid').value+'</div><div class="issuer">'+$('issuer').value+'</div><div class="serial">관리번호 <b>'+no+'</b></div><div class="seal">상생<br>협력</div><div class="credit">'+d.credit+'</div>';sheet.appendChild(c)}}['title','amount','amountKor','usage','issue','valid','issuer','serialStart','project','usageColor'].forEach(id=>$(id).addEventListener('input',render));$('design').addEventListener('change',render);$('apply').onclick=render;$('download').onclick=async()=>{render();const b=$('download');b.disabled=true;b.textContent='⏳ A4 PNG 생성 중...';try{await Promise.all([...document.querySelectorAll('.photo')].map(x=>x.complete?Promise.resolve():new Promise(r=>{x.onload=r;x.onerror=r})));const canvas=await html2canvas(sheet,{scale:3,backgroundColor:'#fff',useCORS:true,imageTimeout:20000});const a=document.createElement('a');a.download='전통시장_상생상품권_A4_4매.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('배경사진을 불러오지 못했습니다.')}finally{b.disabled=false;b.textContent='⬇ A4 상품권 PNG 다운로드'}};render();</script></body></html>
